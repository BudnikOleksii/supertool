name: supertool

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supertool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supertool}
      POSTGRES_DB: ${POSTGRES_DB:-supertool}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-supertool} -d $${POSTGRES_DB:-supertool}']
      interval: 5s
      timeout: 5s
      retries: 10

  # slot: api service (Story 1.7 — entrypoint runs migrate → [seed] → listen)
  # slot: money-tracker service (Story 1.7)

volumes:
  postgres-data:
