# Merged CI (ED3): frontend + backend quality gates in one workflow.
# Job slots reserved for later stories:
#   - i18n-parity (Story 1.4 — locale key parity, FR20)
#   - client-drift (Story 1.3 — OpenAPI generated-client drift gate, D8)
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  init-env:
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.set-env.outputs.node_version }}
    steps:
      - run: echo "Passing environment variables to context"

      - name: Checkout code
        uses: actions/checkout@v6

      - id: set-env
        uses: ./.github/actions/env-versions

  lint:
    needs: [init-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-pnpm-node-deps
        with:
          node_version: ${{ needs.init-env.outputs.node_version }}

      - name: Run lint (oxlint + package lint tasks)
        run: |
          pnpm lint

  fmt-check:
    needs: [init-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-pnpm-node-deps
        with:
          node_version: ${{ needs.init-env.outputs.node_version }}

      - name: Run oxfmt check
        run: |
          pnpm fmt:check

  type-check:
    needs: [init-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-pnpm-node-deps
        with:
          node_version: ${{ needs.init-env.outputs.node_version }}

      - name: Build packages
        run: |
          pnpm build:packages

      - name: Run type-check
        run: |
          pnpm type-check

  stylelint:
    needs: [init-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-pnpm-node-deps
        with:
          node_version: ${{ needs.init-env.outputs.node_version }}

      - name: Run stylelint
        run: |
          pnpm stylelint

  build:
    needs: [init-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-pnpm-node-deps
        with:
          node_version: ${{ needs.init-env.outputs.node_version }}

      - name: Run build
        run: |
          pnpm build

  test:
    needs: [init-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-pnpm-node-deps
        with:
          node_version: ${{ needs.init-env.outputs.node_version }}

      - name: Run tests
        run: |
          pnpm test
