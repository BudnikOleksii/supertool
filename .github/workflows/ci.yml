# Merged CI (ED3): frontend + backend quality gates in one workflow.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

# Non-secret placeholders so the API can be CONSTRUCTED for codegen/type-check/build.
# emit-openapi only introspects routes then closes the app — it never connects to
# Postgres (pg Pool is lazy) nor signs anything, so real credentials add no value here.
# Real values are supplied at runtime via apps/api/.env (gitignored).
env:
  DATABASE_URL: postgres://supertool:supertool@localhost:5432/supertool
  BETTER_AUTH_SECRET: ci-codegen-placeholder-not-a-real-secret
  BETTER_AUTH_URL: http://localhost:3000
  AUTH_TRUSTED_ORIGINS: http://localhost:3000

jobs:
  init-env:
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.set-env.outputs.node_version }}
    steps:
      - run: echo "Passing environment variables to context"

      - name: Checkout code
        uses: actions/checkout@v6

      - id: set-env
        uses: ./.github/actions/env-versions

  lint:
    needs: [init-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-pnpm-node-deps
        with:
          node_version: ${{ needs.init-env.outputs.node_version }}

      - name: Run lint (oxlint + package lint tasks)
        run: |
          pnpm lint

  fmt-check:
    needs: [init-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-pnpm-node-deps
        with:
          node_version: ${{ needs.init-env.outputs.node_version }}

      - name: Run oxfmt check
        run: |
          pnpm fmt:check

  type-check:
    needs: [init-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-pnpm-node-deps
        with:
          node_version: ${{ needs.init-env.outputs.node_version }}

      - name: Build packages
        run: |
          pnpm build:packages

      - name: Run type-check
        run: |
          pnpm type-check

  stylelint:
    needs: [init-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-pnpm-node-deps
        with:
          node_version: ${{ needs.init-env.outputs.node_version }}

      - name: Run stylelint
        run: |
          pnpm stylelint

  build:
    needs: [init-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-pnpm-node-deps
        with:
          node_version: ${{ needs.init-env.outputs.node_version }}

      - name: Run build
        run: |
          pnpm build

  test:
    needs: [init-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-pnpm-node-deps
        with:
          node_version: ${{ needs.init-env.outputs.node_version }}

      - name: Run tests
        run: |
          pnpm test

  i18n-parity:
    needs: [init-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-pnpm-node-deps
        with:
          node_version: ${{ needs.init-env.outputs.node_version }}

      - name: Run i18n key-parity check
        run: |
          pnpm i18n:parity

  client-drift:
    needs: [init-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup-pnpm-node-deps
        with:
          node_version: ${{ needs.init-env.outputs.node_version }}

      - name: Regenerate API client
        run: |
          pnpm turbo run generate:client

      - name: Fail on generated-client drift
        run: |
          test -z "$(git status --porcelain -- packages/shared/src/generated)"
