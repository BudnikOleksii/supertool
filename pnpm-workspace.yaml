packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # install-time telemetry (via swagger-ui-dist) — never allowed (NFR4)
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  # @parcel/watcher and sharp ship prebuilt platform binaries as optional deps;
  # their install scripts are native-build fallbacks we never need locally or in CI
  sharp: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.9.17'
  - '@turbo/darwin-arm64@2.9.17'
  - '@turbo/linux-64@2.9.17'
  - '@turbo/linux-arm64@2.9.17'
  - '@turbo/windows-64@2.9.17'
  - '@turbo/windows-arm64@2.9.17'
  - turbo@2.9.17
  - '@swc/core-darwin-arm64@1.15.41'
  - '@swc/core-darwin-x64@1.15.41'
  - '@swc/core-linux-arm-gnueabihf@1.15.41'
  - '@swc/core-linux-arm64-gnu@1.15.41'
  - '@swc/core-linux-arm64-musl@1.15.41'
  - '@swc/core-linux-ppc64-gnu@1.15.41'
  - '@swc/core-linux-s390x-gnu@1.15.41'
  - '@swc/core-linux-x64-gnu@1.15.41'
  - '@swc/core-linux-x64-musl@1.15.41'
  - '@swc/core-win32-arm64-msvc@1.15.41'
  - '@swc/core-win32-ia32-msvc@1.15.41'
  - '@swc/core-win32-x64-msvc@1.15.41'
  - '@swc/core@1.15.41'
  - '@storybook/addon-a11y@10.4.4'
  - '@storybook/addon-docs@10.4.4'
  - '@storybook/builder-vite@10.4.4'
  - '@storybook/csf-plugin@10.4.4'
  - '@storybook/react-dom-shim@10.4.4'
  - '@storybook/react-vite@10.4.4'
  - '@storybook/react@10.4.4'
  - storybook@10.4.4
