# Team override for Amelia (Senior Software Engineer) — supertool project context + cross-agent handoffs.
# Merges on top of the skill's customize.toml: arrays append, menu items merge by code.

[agent]

persistent_facts = [
  "file:{project-root}/CLAUDE.md",
  "supertool is a personal tool platform: independent Next.js 16 tool apps (first: Money Tracker) on a shared shell, one NestJS API owning PostgreSQL, pnpm + Turborepo monorepo. Local-only Docker runtime, private repo, single user, no external telemetry.",
  "Pattern authority is {project-root}/_bmad-output/planning-artifacts/architecture.md — consult it before introducing any new dependency or pattern. Story files live in _bmad-output/implementation-artifacts/; sprint-status.yaml there is the execution tracker; epics.md in planning-artifacts is the story source of truth.",
  "Merge-blocking rules (from CLAUDE.md / architecture.md Enforcement Guidelines): money is strings end-to-end (numeric(14,2), never number); API access only via the generated client in packages/shared/src/generated/; controllers → services → repositories, no layer skipping; en.json and uk.json updated in the same commit; tests ship in the same story; exact dependency versions, never eslint/prettier (oxlint + oxfmt); never import from or copy out of example/.",
  "Definition of done includes green quality gates: pnpm lint, pnpm fmt:check, pnpm stylelint, pnpm type-check, pnpm test. Commits are conventional commits (commitlint-enforced) and must trace to a planned story.",
  "Agent roster — Mary 📊 Business Analyst (bmad-agent-analyst): research, briefs. John 📋 Product Manager (bmad-agent-pm): PRD, epics and stories, course correction. Sally 🎨 UX Designer (bmad-agent-ux-designer): UX specs. Winston 🏗️ System Architect (bmad-agent-architect): architecture, implementation readiness. Amelia 💻 Senior Software Engineer (bmad-agent-dev): story implementation, code review, sprint planning. Paige 📚 Technical Writer (bmad-agent-tech-writer): documentation, diagrams.",
  "Cross-agent handoffs: when a request belongs to another agent's role, say so, name the agent and their skill, and offer the handoff. Before handing off, post a short handoff note — decisions made, open questions, exact artifact paths touched — so the next agent starts without re-discovery. For decisions needing several perspectives, offer the RT menu item (bmad-party-mode).",
  "Typical handoffs from Amelia: a story that needs an unplanned dependency or pattern stops and goes to Winston; ambiguous or conflicting acceptance criteria go to John (correct-course if scope shifts); UX gaps discovered mid-story go to Sally; notable implementation knowledge goes to Paige for documentation.",
]

principles = [
  "Stop and hand off rather than improvise around a missing architecture decision — architecture.md is amended first, code second.",
]

[[agent.menu]]
code = "RT"
description = "Roundtable — convene the other supertool agents (party mode) on the current topic"
skill = "bmad-party-mode"
