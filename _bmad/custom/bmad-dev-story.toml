# Team override for bmad-dev-story — branch-first story workflow (supertool).
# Merges on top of the skill's customize.toml: arrays append.

[workflow]

activation_steps_append = [
  "Branch guard: run `git branch --show-current`. If on `main`, create and switch to a story branch named `TOOLS-<epic>-<story>/<brief-kebab-slug>` (e.g. `TOOLS-1-2/api-foundation-health-check`) BEFORE writing any code or story-file updates. Never commit story work to `main`.",
]

persistent_facts = [
  "Branch naming convention: `TOOLS-<story number>/<brief description of what is being done>` — e.g. `TOOLS-1-2/api-foundation-health-check`. All story implementation happens on such a branch.",
  "`main` only receives PR merges — the NFR2 CodeRabbit review gate and CI primarily run on pull requests. Story flow: implement on the TOOLS branch → status `review` → run code review locally → after review passes, invoke the `create-pr` skill to push and open the PR.",
  "Reference-first implementation: before implementing each task, fully read the `example/track-my-life` files the story cites for it. When a story task is silent on references, proactively look up the counterpart in `example/track-my-life` (components in `packages/ui/src/components/`, i18n in `apps/money-tracker/src/i18n/` + `messages/`, styles in `packages/ui/src/styles/`) and follow its pattern. The example is USED AS REFERENCE for patterns and code style, adapted to supertool conventions — never import from or literally copy `example/` code (ED1).",
  "VISUAL QA IS MANDATORY for any story that touches `packages/ui`, `packages/shell` UI, or styles (lesson from stories 1.4 AND 1.8 — both shipped visually broken components while every gate was green). Passing tests, type-check, build, and even axe a11y scans is NOT visual verification. Before marking such a task complete: build Storybook, screenshot EVERY changed/added component in BOTH themes INCLUDING open/interactive states (select expanded, dialog open, dropdown open, toast visible — closed-state screenshots hide defects), actually LOOK at each screenshot, compare against the reference component, and record the findings plus screenshot paths in Dev Agent Record. A local headless-browser harness works: throwaway `playwright-core` project in /tmp using the cached `~/Library/Caches/ms-playwright` chromium against `storybook-static` or `pnpm dev` — never add browser tooling to the repo.",
  "Component-parity guard: when a story claims parity with or repair against the reference, FIRST diff the component directory trees (`example/track-my-life/packages/ui/src/components/{atoms,molecules}` vs `packages/ui/src/components/`), list every gap explicitly in Dev Agent Record, and reconcile the list against the story's stated scope. Implementing only the components that already exist locally while the story says 'against the reference' is the 1.8 failure mode.",
  "Storybook renders the REAL design system only if fonts are loaded there: Poppins comes from `next/font` in the app and does NOT exist in Storybook unless the preview loads it. Until story 1-9 lands the font in `.storybook/`, treat Storybook typography as untrustworthy and say so in verification notes.",
]
